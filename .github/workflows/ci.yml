name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  build-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Pin npm version from packageManager
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p "const pm=require('./package.json').packageManager||''; if (!pm.startsWith('npm@')) throw new Error('Expected npm packageManager'); pm.slice(4)")"
          npm install --global "npm@${npm_version}"
          npm --version

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit runtime dependencies
        run: npm run audit:npm

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify public package contents
        run: npm run pack:check

  # BEGIN PLASIUS PUBLIC ARTIFACT INTEGRITY JOB
  public_artifact_integrity:
    name: Public artifact integrity
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify public artifact integrity
        run: node ./scripts/verify-public-artifacts.cjs '--package-dir' '.'
  # END PLASIUS PUBLIC ARTIFACT INTEGRITY JOB
